version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "type:ci"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      tunit:
        patterns: ["TUnit*"]
      testcontainers:
        patterns: ["Testcontainers*"]
      observability:
        patterns: ["OpenTelemetry*", "Serilog*", "Microsoft.ApplicationInsights*"]
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*", "MySqlConnector*", "Pomelo.EntityFrameworkCore*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "type:ci"]
    commit-message:
      prefix: "chore(actions)"
      include: scope
