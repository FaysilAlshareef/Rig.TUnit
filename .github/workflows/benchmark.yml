name: Benchmark

# Runs BenchmarkDotNet after every merge to master, publishes the merged
# results to gh-pages via benchmark-action/github-action-benchmark, and fails
# the run when any benchmark regresses by ≥ 20 % vs the prior data point.
#
# Path-filtered: only fires when production source, the benchmark project,
# or the package pin file changes — pure docs/CI/test commits skip it.
#
# Manual re-run: use the "Run workflow" button (workflow_dispatch).

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**/*.cs'
      - 'tests/Rig.TUnit.Benchmarks/**'
      - 'Directory.Packages.props'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write   # required for benchmark-action/github-action-benchmark to push to gh-pages

jobs:
  benchmark-regression:
    name: Benchmark regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run benchmarks
        # `--job` is no longer passed on the CLI; the run shape comes from
        # `CiBenchmarkConfig` in tests/Rig.TUnit.Benchmarks/Program.cs
        # (3 warmup × 5 iterations × 1 launch). The previous `--job short`
        # default (1 × 3 × 1) produced ~50 % per-bench variance on shared
        # GH-hosted runners — see the 2026-04-26 RCA in
        # `chore/benchmark-regression-rca`.
        run: |
          dotnet run -c Release --project tests/Rig.TUnit.Benchmarks -- \
            --exporters json --artifacts ./benchmark-results --filter '*'
      - name: Merge benchmark JSON files
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys

          results_dir = pathlib.Path('./benchmark-results/results')
          files = sorted(results_dir.glob('*-report-full-compressed.json'))
          if not files:
              print('No benchmark result files found.', file=sys.stderr)
              sys.exit(1)

          merged_benchmarks = []
          meta = None
          for f in files:
              data = json.loads(f.read_text(encoding='utf-8'))
              if meta is None:
                  meta = {k: v for k, v in data.items() if k != 'Benchmarks'}
              merged_benchmarks.extend(data.get('Benchmarks', []))

          out = pathlib.Path('./benchmark-results/merged.json')
          out.write_text(json.dumps({**(meta or {}), 'Benchmarks': merged_benchmarks}, indent=2), encoding='utf-8')
          print(f'Merged {len(files)} file(s), {len(merged_benchmarks)} benchmark(s) -> {out}')
          PYEOF
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          output-file-path: ./benchmark-results/merged.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Only push to gh-pages and gate on alerts when running against
          # master. workflow_dispatch / branch runs produce artefacts +
          # console output but don't pollute the master baseline timeline
          # or fail the run while the new measurement methodology
          # (CiBenchmarkConfig) is being validated.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: ${{ github.ref == 'refs/heads/master' }}
      - name: Upload benchmark artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: ./benchmark-results/**
          retention-days: 14
          if-no-files-found: warn

      # github-action-benchmark publishes the dashboard under
      # gh-pages/dev/bench/. The root of gh-pages 404s because no index.html
      # exists there, so badge links and bare URLs to the project Pages site
      # break. Add a one-line redirect once so the root resolves to the
      # dashboard. Idempotent: later runs see the file and exit early.
      - name: Ensure gh-pages root redirect
        if: always() && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          git clone --depth=1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$workdir"
          cd "$workdir"
          if [ -f index.html ]; then
            echo "Root index.html already present — nothing to do."
            exit 0
          fi
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Rig.TUnit benchmarks</title>
              <meta http-equiv="refresh" content="0; url=./dev/bench/">
              <link rel="canonical" href="./dev/bench/">
            </head>
            <body>
              <p>Redirecting to the <a href="./dev/bench/">benchmark dashboard</a>…</p>
            </body>
          </html>
          HTML
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'docs(gh-pages): add root redirect to dev/bench/ dashboard'
          git push origin gh-pages
