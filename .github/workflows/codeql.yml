name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Directory.Packages.props'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: "30 6 * * 1"   # weekly Monday 06:30 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `build-mode: none` lets the CodeQL C# extractor scan source directly
      # without invoking the .NET toolchain. Previously the run spent ~12 of
      # every 15 minutes on `dotnet restore + build` of Rig.TUnit.slnx (60+
      # projects). With no-build extraction the run lands in ~3-5 min and
      # keeps full security-and-quality coverage — the extractor resolves
      # type references from the source graph itself.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
