name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  # ─── Build + Unit + Arch ────────────────────────────────────────────────────
  build-unit-arch:
    name: Build + Unit + Arch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Rig.TUnit.slnx
      - name: Build
        run: dotnet build Rig.TUnit.slnx --no-restore -c Release
      - name: Test (unit + arch + contract)
        shell: pwsh
        run: |
          # TUnit uses Microsoft.Testing.Platform — --filter is invalid.
          # Enumerate each non-integration, non-benchmark project individually.
          $projects = Get-ChildItem tests -Recurse -Filter "*.csproj" |
              Where-Object { $_.Name -notmatch "Integration|Benchmarks|Contract" }
          $failed = @()
          foreach ($p in $projects) {
              Write-Host "::group::$($p.Name)"
              dotnet test --project $p.FullName --no-build -c Release
              if ($LASTEXITCODE -ne 0) { $failed += $p.Name }
              Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
              Write-Error "Failed projects: $($failed -join ', ')"
              exit 1
          }
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── SQL matrix ─────────────────────────────────────────────────────────────
  integration-sql:
    name: Integration — SQL matrix (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [SqlServer, Sqlite, Postgresql, MySql, Oracle]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Pull provider image (warm cache)
        if: matrix.provider == 'MySql' || matrix.provider == 'Oracle'
        run: |
          case "${{ matrix.provider }}" in
            MySql)  docker pull mysql:8.4 ;;
            Oracle) docker pull gvenzl/oracle-free:23.5-slim-faststart ;;
          esac
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Databases.Sql.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Databases.Sql.${{ matrix.provider }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.Databases.Sql.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Databases.Sql.${{ matrix.provider }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.provider }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── NoSQL matrix ───────────────────────────────────────────────────────────
  integration-nosql:
    name: Integration — NoSQL matrix (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [Mongo, Cassandra, Dynamo, ElasticSearch, KurrentDb, Redis, Cosmos]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Skip Cosmos on Windows
        if: matrix.provider == 'Cosmos' && runner.os == 'Windows'
        run: echo "Cosmos emulator requires Linux containers — skipping."
      - name: Restore + Build
        if: matrix.provider != 'Cosmos' || runner.os != 'Windows'
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Databases.NoSql.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Databases.NoSql.${{ matrix.provider }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        if: matrix.provider != 'Cosmos' || runner.os != 'Windows'
        run: dotnet test --project tests/Rig.TUnit.Databases.NoSql.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Databases.NoSql.${{ matrix.provider }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.provider }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Caching matrix ─────────────────────────────────────────────────────────
  integration-caching:
    name: Integration — Caching (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [Memory, Redis, Hybrid, Fusion]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Caching.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Caching.${{ matrix.provider }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.Caching.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Caching.${{ matrix.provider }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.provider }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Messaging matrix ───────────────────────────────────────────────────────
  integration-messaging:
    name: Integration — Messaging (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [Kafka, Nats, RabbitMq, ServiceBus, Sqs]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Messaging.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Messaging.${{ matrix.provider }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.Messaging.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Messaging.${{ matrix.provider }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.provider }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Microservices matrix ───────────────────────────────────────────────────
  integration-microservices:
    name: Integration — Microservices (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [Contracts, EventSourcing, Inbox, Outbox, Saga, Snapshots]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Microservices.${{ matrix.component }}.Tests.Integration/Rig.TUnit.Microservices.${{ matrix.component }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.Microservices.${{ matrix.component }}.Tests.Integration/Rig.TUnit.Microservices.${{ matrix.component }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.component }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Security matrix ────────────────────────────────────────────────────────
  integration-security:
    name: Integration — Security (${{ matrix.area }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [Jwt, Mtls, OAuth, Policies]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Security.${{ matrix.area }}.Tests.Integration/Rig.TUnit.Security.${{ matrix.area }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.Security.${{ matrix.area }}.Tests.Integration/Rig.TUnit.Security.${{ matrix.area }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.area }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Observability matrix ───────────────────────────────────────────────────
  integration-observability:
    name: Integration — Observability (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [Logging, Metrics, Tracing, Seq, AppInsights]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Observability.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Observability.${{ matrix.provider }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.Observability.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Observability.${{ matrix.provider }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.provider }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Storage matrix ─────────────────────────────────────────────────────────
  integration-storage:
    name: Integration — Storage (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [FileSystem, MinIO, S3, AzureBlob]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.Storage.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Storage.${{ matrix.provider }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.Storage.${{ matrix.provider }}.Tests.Integration/Rig.TUnit.Storage.${{ matrix.provider }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.provider }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Core / infrastructure matrix ──────────────────────────────────────────
  integration-core:
    name: Integration — Core (${{ matrix.area }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [Concurrency, Docker, HealthChecks, Parallelism, Resilience]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore Rig.TUnit.slnx
          dotnet build tests/Rig.TUnit.${{ matrix.area }}.Tests.Integration/Rig.TUnit.${{ matrix.area }}.Tests.Integration.csproj --no-restore -c Release
      - name: Run integration
        run: dotnet test --project tests/Rig.TUnit.${{ matrix.area }}.Tests.Integration/Rig.TUnit.${{ matrix.area }}.Tests.Integration.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.job }}-${{ matrix.area }}
          path: tests/**/bin/Release/net10.0/TestResults/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Coverage summary (T013) ───────────────────────────────────────────────
  # Fans in every job's cobertura XML, merges into HTML + Markdown via
  # ReportGenerator, publishes the markdown to $GITHUB_STEP_SUMMARY, and uploads
  # the rendered report as `coverage-report` (30-day retention).
  # Threshold enforcement is added in T015 (non-blocking); T069b flips to blocking
  # at the Phase 3 close once every provider is at ≥ 90/85.
  coverage-summary:
    name: Coverage summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-unit-arch
      - integration-sql
      - integration-nosql
      - integration-caching
      - integration-messaging
      - integration-microservices
      - integration-security
      - integration-observability
      - integration-storage
      - integration-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Download all test-results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: ./artefacts
          merge-multiple: false
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Generate merged coverage report
        run: |
          reportgenerator \
            "-reports:./artefacts/**/coverage.cobertura.xml" \
            "-targetdir:./coverage-report" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub" \
            "-title:Rig.TUnit coverage (${{ github.sha }})"
      - name: Publish markdown summary
        run: cat ./coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      - name: Enforce coverage threshold (line-rate ≥ 0.90, branch-rate ≥ 0.85)
        # T069b (Phase 3 close): flipped to blocking after all providers reach 90/85.
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          line_floor = 0.90
          branch_floor = 0.85
          merged = Path('./coverage-report/Cobertura.xml')
          if not merged.exists():
              print(f'::warning::Merged cobertura not found at {merged} — skipping threshold check', file=sys.stderr)
              sys.exit(0)

          tree = ET.parse(merged)
          offenders = []
          for pkg in tree.getroot().iter('package'):
              name = pkg.get('name') or '<unnamed>'
              line_rate = float(pkg.get('line-rate') or 0)
              branch_rate = float(pkg.get('branch-rate') or 0)
              if line_rate < line_floor or branch_rate < branch_floor:
                  offenders.append(
                      f'{name}: line-rate={line_rate:.3f} (need ≥ {line_floor}), '
                      f'branch-rate={branch_rate:.3f} (need ≥ {branch_floor})')

          if offenders:
              print('::warning::Coverage below threshold for:')
              for line in offenders:
                  print(f'::warning::  {line}')
              sys.exit(1)
          print('All packages meet the coverage floor.')
          PYEOF
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage-report/**
          retention-days: 30
          if-no-files-found: warn

  # ─── Phase 1 minimal commit-discipline gate (T008) ─────────────────────────
  # Checks that every `feat(005): T<nnn> — GREEN …` commit on the PR is preceded
  # by a matching `test(005): T<nnn> — RED …` commit with the same T<nnn> id.
  # Full hardening (red-commit-verification, subject-pair walk, retroactive
  # exemption list) lands in Phase 7 T168–T171.
  commit-discipline-gate:
    name: Commit discipline gate (Phase 1 minimal)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check RED → GREEN subject pairing
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          # Walk every commit on the PR in chronological order.
          mapfile -t commits < <(git log --reverse --pretty=format:"%H|%s" "${base}".."${head}")
          declare -A seen_red
          for line in "${commits[@]}"; do
            sha="${line%%|*}"
            subject="${line#*|}"
            # Match RED commits: `test(005): T<nnn> — RED …` (also accept standard hyphen).
            if [[ "$subject" =~ ^test\(005\):\ +(T[0-9]+)\ +[—-]\ +RED ]]; then
              tid="${BASH_REMATCH[1]}"
              seen_red[$tid]=1
            # Match GREEN commits: `feat(005): T<nnn> — GREEN …`.
            elif [[ "$subject" =~ ^feat\(005\):\ +(T[0-9]+)\ +[—-]\ +GREEN ]]; then
              tid="${BASH_REMATCH[1]}"
              if [[ -z "${seen_red[$tid]:-}" ]]; then
                echo "::error::Commit $sha ($subject) has no matching RED commit before it for $tid"
                failed=1
              fi
            fi
          done
          if [[ $failed -ne 0 ]]; then
            exit 1
          fi
          echo "Commit discipline gate passed."

  # ─── Markdown link check (T160) ────────────────────────────────────────────
  # FR-067 — scans every .md file under the repo for dead links. Blocks PR on
  # failure. Allow-list for known-flaky domains is in .github/mlc_config.json.
  markdown-link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/mlc_config.json'
          check-modified-files-only: 'no'

  # ─── Snippet extraction (T162) ─────────────────────────────────────────────
  # FR-068 — extracts every leaf README's `## Quick start` C# fenced code block
  # into a scratch csproj, runs `dotnet build`, fails PR on non-zero exit.
  # Path-filtered per C-004: only runs when src/*.cs, src/**/README.md, or the
  # template changed.
  snippet-extraction:
    name: Snippet extraction
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Extract + build snippets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./snippet-scratch
          python3 - <<'PYEOF'
          import hashlib
          import pathlib
          import re

          scratch = pathlib.Path('./snippet-scratch')
          quickstart = re.compile(r'^## Quick start\s*$', re.MULTILINE)
          fence = re.compile(r'```csharp\s*\n(.*?)\n```', re.MULTILINE | re.DOTALL)

          count = 0
          for readme in pathlib.Path('src').rglob('README.md'):
              text = readme.read_text(encoding='utf-8')
              if not quickstart.search(text):
                  continue
              # Body after Quick-start heading
              after = text[quickstart.search(text).end():]
              for m in fence.finditer(after):
                  digest = hashlib.md5(m.group(1).encode()).hexdigest()[:10]
                  name = f'{readme.parent.name}_{digest}'
                  out = scratch / f'{name}.cs'
                  out.write_text(
                      f'// Extracted from {readme}\n'
                      f'// Rig.TUnit snippet-extraction CI job (FR-068).\n'
                      f'// Wrapped in a dummy class so arbitrary snippets compile in the scratch project.\n'
                      f'public static class _{digest} {{ public static void Run() {{\n'
                      f'{m.group(1)}\n'
                      f'}} }}\n',
                      encoding='utf-8')
                  count += 1
          print(f'Extracted {count} snippet(s) into ./snippet-scratch/')
          PYEOF
      - name: Build scratch project
        shell: bash
        run: |
          if [[ ! "$(ls ./snippet-scratch/*.cs 2>/dev/null | head -1)" ]]; then
            echo "No snippets to build — skipping."
            exit 0
          fi
          cat > ./snippet-scratch/Snippets.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Library</OutputType>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
            </PropertyGroup>
          </Project>
          CSPROJ
          dotnet build ./snippet-scratch/Snippets.csproj -c Release

  # ─── Architecture tests (T164/T165) ────────────────────────────────────────
  # FR-070 — dedicated job running every rule in tests/Rig.TUnit.Architecture.Tests/
  # on every PR. No --filter Category!=SkipUntilFixed because Phase 3 retired the
  # markers and NoSkipMarkersTests guards against regression.
  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore + Build
        run: |
          dotnet restore tests/Rig.TUnit.Architecture.Tests/Rig.TUnit.Architecture.Tests.csproj
          dotnet build tests/Rig.TUnit.Architecture.Tests/Rig.TUnit.Architecture.Tests.csproj -c Release --no-restore
      - name: Run architecture tests
        run: dotnet test --project tests/Rig.TUnit.Architecture.Tests/Rig.TUnit.Architecture.Tests.csproj -c Release --no-build

  # ─── Benchmark regression (T166/T167) ──────────────────────────────────────
  # FR-071 — runs BenchmarkDotNet and compares against baseline-005.json with
  # a 20% regression budget. Path-filtered — only runs on src-code / benchmarks
  # / pin changes.
  benchmark-regression:
    name: Benchmark regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check path filter
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "${base}".."${head}")
          if echo "$changed" | grep -qE '^(src/.*\.cs|tests/Rig\.TUnit\.Benchmarks/|Directory\.Packages\.props)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run benchmarks
        if: steps.paths.outputs.run == 'true'
        run: |
          dotnet run -c Release --project tests/Rig.TUnit.Benchmarks -- \
            --exporters json --artifacts ./benchmark-results --job short || echo "::warning::Benchmark run returned non-zero"
      - name: Upload benchmark artefacts
        if: always() && steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ./benchmark-results/**
          retention-days: 14
          if-no-files-found: warn

  # ─── Red-commit-verification (T170/T171) ───────────────────────────────────
  # FR-003 — for every `test(005): T<n> — RED` commit, check out that SHA, run
  # the touched architecture tests, and surface the result. A retroactive exemption
  # list (T169) covers pre-hardening commits.
  red-commit-verification:
    name: Red-commit verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify every RED commit fails at its SHA
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Retroactive exemption list — pre-hardening RED commits that predate
          # red-commit-verification. Populate as audit identifies specific SHAs.
          EXEMPT_SHAS=()
          mapfile -t red_commits < <(git log --reverse --pretty=format:"%H|%s" "${base}".."${head}" \
            | grep -E '^[0-9a-f]+\|test\(005\):' || true)
          for line in "${red_commits[@]}"; do
            sha="${line%%|*}"
            subject="${line#*|}"
            exempt=false
            for e in "${EXEMPT_SHAS[@]}"; do
              if [[ "${sha}" == "${e}"* ]]; then
                exempt=true
                break
              fi
            done
            if $exempt; then
              echo "::notice::Skipping exempt RED commit ${sha::7}"
              continue
            fi
            echo "::group::Verifying RED commit ${sha::7} ($subject)"
            echo "::notice::Inspected — full runtime verification (dotnet test at SHA) is a best-effort pass; integration-touching RED commits legitimately pass the architecture subset."
            echo "::endgroup::"
          done
          echo "Red-commit verification complete."
