name: Bug report
description: Something is broken in Rig.TUnit — fixture won't start, assertion is wrong, etc.
title: "[bug] "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Please fill in the form so we can reproduce.
        For security findings, follow [`SECURITY.md`](https://github.com/FaysilAlshareef/Rig.TUnit/blob/master/SECURITY.md) instead.
  - type: input
    id: package
    attributes:
      label: Affected package(s)
      description: e.g. `Rig.TUnit.Databases.Sql.Postgresql`
      placeholder: Rig.TUnit.<area>
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0-beta.1
    validations: { required: true }
  - type: input
    id: dotnet
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`
      placeholder: 10.0.100
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Host OS
      options: [Windows, macOS, Linux, Other]
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        A focused snippet (or link to a repo) that reproduces the issue.
        Include the test code, fixture setup, and any relevant `appsettings`.
      render: csharp
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error message and a relevant log excerpt.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - { label: I searched existing issues and discussions for duplicates., required: true }
        - { label: I am running the latest published version., required: false }
        - { label: I included a minimal reproduction., required: true }
