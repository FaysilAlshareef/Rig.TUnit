title: "[q] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: One paragraph — what's your goal? What have you tried?
    validations: { required: true }
  - type: textarea
    id: code
    attributes:
      label: Relevant code (optional)
      render: csharp
  - type: input
    id: package
    attributes:
      label: Package(s) involved
      placeholder: Rig.TUnit.<area>
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0-beta.1
